# Publie le site (dossier site/) sur GitHub Pages à chaque envoi sur la branche main.
# Le site est fait de fichiers HTML, CSS et JS prêts à l'emploi : aucune construction, rien à installer.
name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le dossier site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
